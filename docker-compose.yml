version: "3.9"

services:
  api-pyservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-ppabe-python
    restart: always
    env_file:
      - .env
    ports:
      - "4001:4001"
    volumes:
      - .:/app
    working_dir: /app
    # Corregido: ejecutamos gunicorn como módulo de Python para asegurar que encuentre el ejecutable
    command: python3.13 -m gunicorn --bind 0.0.0.0:4001 index:app --workers 4 --timeout 120

networks:
  default:
    driver: bridge